version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - worker
      - jaeger
      - vault

  worker:
    build: .
    command: celery -A src.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A src.workers.celery_app.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - worker

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # --- Observability ---

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    depends_on:
      - api

  # --- Secrets ---

  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"   # API
      - "8201:8201"   # Cluster
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    restart: unless-stopped

volumes:
  qdrant-data:
  prometheus-data:
  vault-data:
