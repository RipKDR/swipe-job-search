[project]
name = "hi-hired-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "supabase>=2.10.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "qdrant-client>=1.12.0",
    "openai>=1.50.0",
    "xgboost>=2.1.0",
    "optuna>=4.1.0",
    "mlflow>=2.17.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "textblob>=0.18.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0", "mypy>=1.13.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
[tool.mypy]
strict = true

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
project-includes = ["src/**/*.py*", "tests/**/*.py*"]
