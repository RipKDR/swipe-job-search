repos:
  - repo: local
    hooks:
      - id: self-correction-4-lens
        name: 4-Lens Self-Correction
        description: "🛡️⚡🔁🧹 Security, Performance, Reliability, Maintainability review"
        entry: python3 tools/self-correction.py --ci
        language: system
        types: [python, javascript, jsx, ts, tsx]
        stages: [pre-commit]
        verbose: true

      - id: ruff
        name: Ruff linter
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff formatter
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]
