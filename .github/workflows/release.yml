# ---------------------------------------------------------------------------
# Release Pipeline — tag push (v*)
# ---------------------------------------------------------------------------
# Triggered on version tag pushes (e.g., v1.2.3).
#
# Flow:
#   1. Validate tag format (semver)
#   2. Create GitHub Release with auto-generated changelog
#   3. Terraform plan + apply (production)
#   4. Backend Docker: build, tag with release version, scan, push to ECR
#   5. Helm deploy to production EKS
#   6. EAS Submit to app stores (disabled until EXPO_TOKEN configured)
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write  # needed for creating GitHub Release

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: hi-hired-production
  ECR_REPOSITORY: hi-hired-production-backend
  TERRAFORM_DIR: infra/terraform
  HELM_DIR: infra/helm/backend
  BACKEND_DIR: backend

jobs:
  # -------------------------------------------------------------------------
  # 1. Validate tag format
  # -------------------------------------------------------------------------
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Check tag format
        id: parse
        run: |
          TAG=${{ github.ref_name }}
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match semver pattern vX.Y.Z"
            exit 1
          fi
          echo "Tag '$TAG' is valid"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # 2. Create GitHub Release
  # -------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Collect commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          echo "## What's Changed" > /tmp/release-body.md
          git log --oneline --no-decorate $RANGE -- \
            ':(exclude)docs/' \
            ':(exclude)**.md' \
            ':(exclude).github/' \
            >> /tmp/release-body.md 2>/dev/null || true
          # Include CHANGELOG section if available
          if [ -f CHANGELOG.md ]; then
            echo "" >> /tmp/release-body.md
            echo "---" >> /tmp/release-body.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for full details." >> /tmp/release-body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
          generate_release_notes: false

  # -------------------------------------------------------------------------
  # 3. Terraform plan + apply (production)
  # -------------------------------------------------------------------------
  terraform:
    name: Terraform (production)
    runs-on: ubuntu-latest
    environment: production
    needs: [validate]
    outputs:
      plan_has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=hi-hired-production-terraform-state" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=hi-hired-production-terraform-locks"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var-file="environments/production/terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

  # -------------------------------------------------------------------------
  # 4. Backend Docker: build, tag with release version, scan, push
  # -------------------------------------------------------------------------
  docker-build:
    name: Backend Docker Build & Push
    runs-on: ubuntu-latest
    environment: production
    needs: [validate]
    outputs:
      image_tag: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-$(date +%Y%m%d%H%M%S) \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-$(date +%Y%m%d%H%M%S)
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: release-container

  # -------------------------------------------------------------------------
  # 5. Helm deploy to production EKS
  # -------------------------------------------------------------------------
  helm-deploy:
    name: Helm Deploy to EKS
    runs-on: ubuntu-latest
    environment: production
    needs: [validate, create-release, terraform, docker-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy Helm chart
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        working-directory: ${{ env.HELM_DIR }}
        run: |
          helm upgrade --install backend . \
            --namespace hi-hired \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set image.repository=${{ needs.docker-build.outputs.image_tag }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend-api -n hi-hired --timeout=5m
          kubectl rollout status deployment/backend-worker -n hi-hired --timeout=5m

      - name: Post-deploy smoke test
        run: |
          PROD_URL="https://hihired.com"
          echo "Smoke testing $PROD_URL ..."
          curl -sSf --max-time 30 "$PROD_URL/health" | head -c 500
          echo ""
          echo "Production smoke test passed"

  # -------------------------------------------------------------------------
  # 6. EAS Submit (disabled until EXPO_TOKEN + store creds configured)
  # -------------------------------------------------------------------------
  eas-submit:
    name: EAS Submit (App Stores)
    runs-on: ubuntu-latest
    needs: [helm-deploy]
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Submit to stores
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas submit --platform all --non-interactive
        working-directory: apps/mobile
