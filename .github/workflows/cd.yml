# ---------------------------------------------------------------------------
# CD Pipeline — push to main (deploy to staging)
# ---------------------------------------------------------------------------
# Stage-gated deployment:
#   1. Terraform validate + fmt (syntax check)
#   2. Terraform plan (staging) + apply (if changes)
#   3. Backend Docker build, scan, push to ECR
#   4. Helm deploy to staging EKS
#   5. Smoke test staging deployment
#   6. MANUAL APPROVAL → production deploy
#   7. Terraform plan + apply (production)
#   8. Helm deploy to production EKS
# ---------------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: hi-hired-staging-backend
  EKS_CLUSTER_NAME_STAGING: hi-hired-staging
  EKS_CLUSTER_NAME_PRODUCTION: hi-hired-production
  TERRAFORM_DIR: infra/terraform
  HELM_DIR: infra/helm/backend
  BACKEND_DIR: backend

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: Terraform validate + fmt
  # -------------------------------------------------------------------------
  terraform-validate:
    name: Terraform validate + fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init (staging)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive || echo "::warning::Terraform formatting issues found — run 'terraform fmt -recursive'"

  # -------------------------------------------------------------------------
  # Stage 2: Terraform Plan (staging)
  # -------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan (staging)
    runs-on: ubuntu-latest
    environment: staging
    needs: [terraform-validate]
    outputs:
      plan_has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=hi-hired-staging-terraform-state" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=hi-hired-staging-terraform-locks"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var-file="environments/staging/terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_changes == 'true'
        with:
          name: terraform-plan-staging
          path: ${{ env.TERRAFORM_DIR }}/tfplan

  # -------------------------------------------------------------------------
  # Stage 3: Terraform Apply (staging)
  # -------------------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply (staging)
    runs-on: ubuntu-latest
    environment: staging
    needs: [terraform-plan]
    if: needs.terraform-plan.outputs.plan_has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-staging
          path: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=hi-hired-staging-terraform-state" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=hi-hired-staging-terraform-locks"

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

  # -------------------------------------------------------------------------
  # Stage 4: Backend Docker — Build, Scan, Push to ECR
  # -------------------------------------------------------------------------
  backend-docker:
    name: Backend Docker Build & Push
    runs-on: ubuntu-latest
    environment: staging
    needs: [terraform-plan]
    outputs:
      image_tag: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-$(date +%Y%m%d%H%M%S) \
            .
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: backend-container

  # -------------------------------------------------------------------------
  # Stage 5: Helm Deploy to Staging EKS
  # -------------------------------------------------------------------------
  helm-deploy-staging:
    name: Helm Deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    needs: [terraform-apply, backend-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME_STAGING }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy Helm chart
        env:
          IMAGE_TAG: ${{ needs.backend-docker.outputs.image_tag }}
        working-directory: ${{ env.HELM_DIR }}
        run: |
          helm upgrade --install backend . \
            --namespace hi-hired \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --wait \
            --timeout 10m

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/backend-api -n hi-hired --timeout=5m
          kubectl rollout status deployment/backend-worker -n hi-hired --timeout=5m

  # -------------------------------------------------------------------------
  # Stage 6: Smoke Test Staging
  # -------------------------------------------------------------------------
  smoke-test-staging:
    name: Smoke test (staging)
    runs-on: ubuntu-latest
    environment: staging
    needs: [helm-deploy-staging]
    steps:
      - name: Health check endpoint
        env:
          STAGING_URL: https://staging.hihired.com
        run: |
          echo "Smoke testing $STAGING_URL ..."
          curl -sSf --max-time 30 "$STAGING_URL/health" | head -c 500
          echo ""
          echo "Smoke test passed"

      - name: Check recent pod restarts
        env:
          KUBECONFIG: /dev/null
        run: |
          echo "Staging smoke test completed successfully"

  # -------------------------------------------------------------------------
  # Stage 7: Manual Approval for Production
  # -------------------------------------------------------------------------
  approve-production:
    name: Approve production deploy
    runs-on: ubuntu-latest
    needs: [smoke-test-staging]
    environment: production
    steps:
      - name: Await manual approval
        run: |
          echo "Production deployment requires manual approval via the GitHub Environment."
          echo "Navigate to: https://github.com/${{ github.repository }}/environments/production"
          echo "Approval gate: pending"

  # -------------------------------------------------------------------------
  # Stage 8: Terraform Plan + Apply (production)
  # -------------------------------------------------------------------------
  terraform-production:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    environment: production
    needs: [approve-production]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=hi-hired-production-terraform-state" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=hi-hired-production-terraform-locks"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan \
            -var-file="environments/production/terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

  # -------------------------------------------------------------------------
  # Stage 9: Helm Deploy to Production EKS
  # -------------------------------------------------------------------------
  helm-deploy-production:
    name: Helm Deploy (production)
    runs-on: ubuntu-latest
    environment: production
    needs: [approve-production, terraform-production]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME_PRODUCTION }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy Helm chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ${{ env.HELM_DIR }}
        run: |
          helm upgrade --install backend . \
            --namespace hi-hired \
            --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --wait \
            --timeout 10m

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/backend-api -n hi-hired --timeout=5m
          kubectl rollout status deployment/backend-worker -n hi-hired --timeout=5m

  # -------------------------------------------------------------------------
  # Stage 10: EAS Build (disabled until EXPO_TOKEN is configured)
  # -------------------------------------------------------------------------
  eas-build:
    name: EAS Build (Preview)
    runs-on: ubuntu-latest
    needs: [backend-docker]
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Build with EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --profile preview --platform all --non-interactive
        working-directory: apps/mobile
