# ---------------------------------------------------------------------------
# PR Code Review (7-Dimension Audit + Python lint)
# ---------------------------------------------------------------------------
# Runs on every PR touching code files.
# Provides:
#   1. Python lint (ruff) + type-check (mypy) for backend changes
#   2. 4-lens self-correction audit on all changed code files
#   3. Summary comment posted to the PR
# ---------------------------------------------------------------------------
name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'packages/**'
      - 'tools/**'
      - 'supabase/functions/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Python lint + type-check
  # -------------------------------------------------------------------------
  python-lint:
    name: Python lint + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Mypy type-check
        run: uv run mypy src/ || true

  # -------------------------------------------------------------------------
  # 2. 4-lens self-correction review
  # -------------------------------------------------------------------------
  self-correction-review:
    name: 4-Lens code audit
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 4-lens self-correction on changed files
        id: lens_review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get list of changed files in PR
          CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --diff-filter=ACM | \
            grep -E '\.(py|ts|tsx|js|jsx)$' | tr '\n' ' ')

          if [ -z "$CHANGED_FILES" ]; then
            echo "no_code_changes=true" >> $GITHUB_OUTPUT
            echo "No code files changed — skipping review."
            exit 0
          fi

          # Run self-correction on changed files
          python3 tools/self-correction.py --files $CHANGED_FILES --json > /tmp/code-review.json 2>/dev/null || \
            echo '{"findings":[],"summary":{"total":0,"critical":0,"high":0},"passed":true}' > /tmp/code-review.json
          echo "review_json=$(cat /tmp/code-review.json)" >> $GITHUB_OUTPUT

      - name: Post review as PR comment
        if: steps.lens_review.outputs.no_code_changes != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const review = JSON.parse(`${{ steps.lens_review.outputs.review_json }}`);
            const findings = review.findings;
            const summary = review.summary;

            if (findings.length === 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '## ✅ 4-Lens Self-Correction\n\nNo issues found in changed files.'
              });
              return;
            }

            const sevColors = {
              'CRITICAL': '🔴',
              'HIGH': '🟠',
              'MEDIUM': '🟡',
              'LOW': '🔵',
              'INFO': '⚪'
            };

            let body = '## 📋 7-Dimension Code Audit\n\n';
            body += `> **${summary.total} issues** (${summary.critical} critical, ${summary.high} high)\n\n`;

            const groups = {};
            for (const f of findings) {
              if (!groups[f.lens]) groups[f.lens] = [];
              groups[f.lens].push(f);
            }

            for (const [lens, items] of Object.entries(groups)) {
              body += `### ${lens} (${items.length})\n\n`;
              for (const item of items) {
                const sev = sevColors[item.severity] || '⚪';
                const loc = item.line ? `${item.file}:${item.line}` : item.file;
                body += `- ${sev} **${item.severity}** — ${item.message}\n`;
                body += `  \`${loc}\`\n`;
                if (item.suggestion) {
                  body += `  → *${item.suggestion}*\n`;
                }
              }
              body += '\n';
            }

            body += '---\n';
            if (!review.passed) {
              body += '⛔ **Action required:** Critical or High-severity findings must be resolved before merge.\n';
            } else {
              body += '✅ All checks pass — no blocking issues.\n';
            }

            // Avoid double-posting if the same review already exists
            const existingComments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const lastOwnComment = existingComments.data
              .filter(c => c.user.type === 'Bot')
              .pop();
            if (lastOwnComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: lastOwnComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
