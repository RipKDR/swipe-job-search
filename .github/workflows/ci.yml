name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # supabase db lint added in U2 when migrations exist
      # EAS build checks in future D phase per EAS_CHECKLIST

  # Note: full E2E / Maestro + EAS preview in later phases (Sam lane)