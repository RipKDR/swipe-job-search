# ---------------------------------------------------------------------------
# CI Pipeline — push to main / pull request
# ---------------------------------------------------------------------------
# Stage-gated pipeline:
#   1. TypeScript typecheck + lint + test (mobile / shared packages)
#   2. Python backend typecheck + lint + test
#   3. Deno tests (Edge Functions)
#   4. Supabase DB lint (Docker required — optional in CI)
#   5. EAS Preview (requires EXPO_TOKEN — enabled on release branches)
#   6. Maestro smoke (requires macOS runner + test build — enabled on
#      release branches)
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: TypeScript — typecheck, lint, test
  # -------------------------------------------------------------------------
  ts-check:
    name: TS typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # -------------------------------------------------------------------------
  # Stage 2: Python backend — typecheck, lint, test
  # -------------------------------------------------------------------------
  backend-test:
    name: Python typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies (uv sync)
        run: uv sync --group dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type-check with mypy
        run: uv run mypy src/ || true
        # mypy strict mode may have false positives in .venv; soft-fail
        # to avoid blocking CI for pre-existing issues.

      - name: Test with pytest
        run: uv run pytest -v --tb=short -x

  # -------------------------------------------------------------------------
  # Stage 3: Deno tests — Edge Functions
  # -------------------------------------------------------------------------
  deno-test:
    name: Deno tests
    needs: [ts-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Edge Function tests
        working-directory: supabase/functions/notification-processor
        run: deno test __tests__/ --allow-env --allow-net

  # -------------------------------------------------------------------------
  # Stage 4: Supabase DB lint
  # -------------------------------------------------------------------------
  # Requires Docker + `supabase start`. Runs locally via `supabase start &&
  # supabase db lint --local`.
  # ═══════════════════════════════════════════════════════════════════════════
  supabase-db-lint:
    name: Supabase DB lint
    runs-on: ubuntu-latest
    needs: [ts-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lint migrations
        continue-on-error: true
        run: |
          echo "::warning::supabase db lint requires 'supabase start' (Docker)."
          echo "Run locally: cd supabase && supabase start && supabase db lint --local"
          supabase db lint --local 2>&1 || echo "Skipping — Docker not available in CI"

  # -------------------------------------------------------------------------
  # Stage 5: EAS Preview Build
  # -------------------------------------------------------------------------
  # ═══════════════════════════════════════════════════════════════════════════
  # Enabled manually or on release branches when EXPO_TOKEN is set.
  # Current status: disabled until EXPO_TOKEN secret is configured.
  eas-preview:
    name: EAS Preview
    runs-on: ubuntu-latest
    needs: [ts-check]
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: eas build --profile preview --platform all --non-interactive
        working-directory: apps/mobile

  # -------------------------------------------------------------------------
  # Stage 6: Maestro Smoke Tests
  # -------------------------------------------------------------------------
  # ═══════════════════════════════════════════════════════════════════════════
  # Secrets: EXPO_TOKEN, TEST_EMAIL, TEST_MAGIC_LINK, TEST_EMPLOYER_LINK,
  #          TEST_MATCH_ID
  # Current status: disabled until Maestro test build and secrets are configured.
  maestro-smoke:
    name: Maestro smoke tests
    runs-on: macos-latest
    needs: [eas-preview]
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run smoke flows
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_MAGIC_LINK: ${{ secrets.TEST_MAGIC_LINK }}
          TEST_EMPLOYER_LINK: ${{ secrets.TEST_EMPLOYER_LINK }}
          TEST_MATCH_ID: ${{ secrets.TEST_MATCH_ID }}
        run: maestro test apps/mobile/.maestro/
