name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Requires Docker + `supabase start` — optional until local Supabase runs in CI.
  # Run locally: supabase start && supabase db lint --local
  supabase-db-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lint migrations against local DB
        continue-on-error: true
        run: |
          supabase db lint --local
        # Fails in CI without `supabase start` (Docker). See README § CI / supabase db lint.

  # Note: full E2E / Maestro + EAS preview in later phases (Sam lane)
